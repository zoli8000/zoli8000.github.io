<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tokenizer Demo</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Monaco loader -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
  <!-- JSON Viewer -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanilla-jsoneditor@latest/themes/jse-theme-dark.css">
<style>
  #json-view tr td:nth-child(4),
  #json-view tr td:nth-child(6) {
    max-width: 20ch;
    min-width: 20ch;
    width: 20ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap; /* single line truncation */
  }

  #json-view tr td:nth-child(4):hover,
  #json-view tr td:nth-child(6):hover {
      min-width: 20ch;
    width: auto;
    max-width: 30ch;
    overflow: auto;
    word-break: break-word;
  }
  .data-line{
    font-family: monospace;
    white-space: pre;
    line-height: 1.2em;
    margin-bottom: 0.2em;
    color: white;
  }

  .data-line .bytes {
      display: inline-block;
      width: 54ch;
  }

  .data-line .address {
      display: inline-block;
      width: 3em;
      margin-right: 1em;
      color: yellow;
      font-weight: 700;
  }
  .data-line .LABEL {
      color: lightgreen;
      font-weight: 700;
  }
  .data-line .CMD {
      color: cyan;
      font-weight: 700;
  }
  .data-line .NUM {
      color: yellow;
      font-weight: 700;
  }
  .data-line .STR {
      color: orange;
      font-weight: 700;
  }
  .json-editor-row-selected {
      background: rgba(59, 130, 246, 0.25) !important;
      outline: 1px solid rgba(96, 165, 250, 0.9);
  }
  .byte-cell {
      transition: background-color 0.15s ease, color 0.15s ease;
      cursor: pointer;
  }
  .byte-cell.byte-selected {
      background: rgba(251, 191, 36, 0.4);
      color: white;
      box-shadow: inset 0 0 0 1px rgba(250, 204, 21, 0.9);
  }
</style>
  <script type="module" crossorigin src="./assets/index-CPcR4Ahy.js"></script>
</head>
<body class="m-0 h-screen flex font-sans">
  <div class="top-2 left-2 z-10 bg-gray-800 text-white px-2 py-1 rounded">
    <label for="lang" class="mr-2">Language:</label>
    <select id="lang" class="bg-gray-700 text-white p-1 rounded">
      <option value="basicv2">BASIC V2</option>
      <option value="golfbasic">GolfBASIC</option>
    </select>
  </div>

  <!-- Left side: Monaco -->
  <div id="editor" class="w-1/2 h-full border-r"></div>

  <!-- Right side: Output -->
  <div id="output" class="w-1/2 flex flex-col">
    <div id="json-tabs" class="flex items-center gap-2 border-b bg-gray-900 px-3 py-2 text-sm text-gray-200">
      <button type="button" data-view="table" class="rounded bg-blue-600 px-2 py-1 text-white">table</button>
      <button type="button" data-view="tree" class="rounded bg-gray-700 px-2 py-1">tree</button>
      <button type="button" data-view="variables" class="rounded bg-gray-700 px-2 py-1">variables</button>
      <button type="button" data-view="const" class="rounded bg-gray-700 px-2 py-1">const</button>
      <button type="button" data-view="errors" class="rounded bg-gray-700 px-2 py-1">errors</button>
    </div>
    <div id="tokens" class="flex-1 min-h-0 bg-gray-900 border-b p-2">
      <div id="json-view" class="h-full overflow-auto"></div>
      <div id="variables-view" class="hidden h-full overflow-auto"></div>
      <div id="const-view" class="hidden h-full overflow-auto"></div>
      <div id="errors-view" class="hidden h-full overflow-auto"></div>
    </div>
    <pre id="bytecode" class="flex-1 overflow-auto p-2 bg-gray-900 font-mono whitespace-pre-wrap"></pre>
    <div id="directives" class="overflow-auto bg-gray-900 text-gray-100 border-b p-2 h-[10em]"></div>
  </div>
  <div id="version" class="absolute bottom-2 right-2 text-gray-500 text-sm"></div>

  <!-- Compiled TypeScript -->

</body>
</html>
